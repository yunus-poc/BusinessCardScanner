name: business_card_scanner
description: "Scans business cards on-device and saves them to Outlook contacts."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
